name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Restore dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --no-restore -c Release

            - name: Test
              run: dotnet test --no-build -c Release
